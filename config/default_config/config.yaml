#*战绩推送总开关（开局提醒 + 打完推战绩，用户需各自 #开启战绩推送 订阅）
onlineReminder: true
#*战绩推送的检查间隔（6 位 cron，含秒）。每个订阅串行拉一次营地接口、间隔 800ms，
#*设太短会触发营地频控 -30107，不建议低于 2 分钟
battleResultCron: '0 */2 * * * *'
#*玩家离线时把检查间隔拉长到几倍 battleResultCron（离线的号既不会开局也不会出新战绩，
#*照高频查纯属白耗配额）。默认 5，即 2 分钟的 cron 在长时间离线后退到 10 分钟一次。
#*代价是上线播报最坏晚这么久；填 1 = 关闭自适应，恒定按 cron 轮询
idleBackoffMax: 5
#*战绩日报的推送时间（6 位 cron）。留空 = 不自动推送，只保留 #王者日报 指令。
#*刻意避开整点：整点是所有人 cron 的默认值，营地那头也扎堆
dailyReportCron: '0 47 23 * * *'
#*战绩周报的推送时间。默认周日晚，和「本周（周一起）」的口径对齐
weeklyReportCron: '0 7 22 * * 0'
#*战绩月报的推送时间。月报口径是「本月至今」，只有月末推才是完整的一个月，
#*但 cron 表达不了「每月最后一天」，所以写成 28-31 号每晚触发、代码里挑真正的最后一天
monthlyReportCron: '0 41 23 28-31 * *'
#*群日报的推送时间（群里 #开启群日报推送 后生效）。群报要逐个扫本群绑定的账号，
#*一个号至少一次营地请求，25 个号约 30 秒，所以和个人日报错开时间，别撞在一起
groupDailyReportCron: '0 22 23 * * *'
#*群周报的推送时间
groupWeeklyReportCron: '0 34 21 * * 0'
#*群月报的推送时间。同 monthlyReportCron，28-31 号触发、只在月末那天真推
groupMonthlyReportCron: '0 18 23 28-31 * *'
#*回复时是否引用触发指令那条消息
quoteReply: true
#*图片缓存目录（data/imgCache）的容量上限，单位 MB。填 0 = 不限量。
#*单张图平均 490KB，#皮肤墙 / #全部皮肤 一次会拉几百张，几个人轮着查就是几百 MB；
#*7 天过期只管时间管不住量，超出上限时按下载时间从旧到新削减
imgCacheMaxMB: 200
#*图片缓存的定时清理时间（6 位 cron）。默认凌晨 4 点，避开白天出图高峰
imgCacheCleanCron: '0 12 4 * * *'
#*皮肤上新推送的检查时间（6 位 cron）。留空 = 不自动推送，只保留 #皮肤上新 指令。
#*数据来自官网资料库（不占营地配额），每天看一次就够：新皮肤都是提前几天进清单的
skinNewsCron: '0 26 12 * * *'
