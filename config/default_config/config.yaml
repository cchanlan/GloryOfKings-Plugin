#*战绩推送总开关（开局提醒 + 打完推战绩，用户需各自 #开启战绩推送 订阅）
onlineReminder: true
#*战绩推送的检查间隔（6 位 cron，含秒）。每个订阅串行拉一次营地接口、间隔 800ms，
#*设太短会触发营地频控 -30107，不建议低于 2 分钟
battleResultCron: '0 */2 * * * *'
#*玩家离线时把检查间隔拉长到几倍 battleResultCron（离线的号既不会开局也不会出新战绩，
#*照高频查纯属白耗配额）。默认 5，即 2 分钟的 cron 在长时间离线后退到 10 分钟一次。
#*只给 #谁在打游戏 采集、不往群里播报的「影子订阅」不走这里：他们只在有人查看那份名单时现刷。
#*代价是上线播报最坏晚这么久；填 1 = 关闭自适应，恒定按 cron 轮询
idleBackoffMax: 5
#*战绩日报的推送时间（6 位 cron）。留空 = 不自动推送，只保留 #王者日报 指令。
#*刻意避开整点：整点是所有人 cron 的默认值，营地那头也扎堆
dailyReportCron: '0 47 23 * * *'
#*战绩周报的推送时间。默认周日晚（一周打完就发）；配成周一也行，那时统计的是上一整周
weeklyReportCron: '0 7 22 * * 0'
#*战绩月报的推送时间。月报口径是「本月至今」，只有月末推才是完整的一个月，
#*但 cron 表达不了「每月最后一天」，所以写成 28-31 号每晚触发、代码里挑真正的最后一天
monthlyReportCron: '0 41 23 28-31 * *'
#*群日报的推送时间（群里 #开启群日报推送 后生效）。群报要逐个扫本群绑定的账号，
#*一个号至少一次营地请求，25 个号约 30 秒，所以和个人日报错开时间，别撞在一起
groupDailyReportCron: '0 22 23 * * *'
#*群周报的推送时间
groupWeeklyReportCron: '0 34 21 * * 0'
#*群月报的推送时间。同 monthlyReportCron，28-31 号触发、只在月末那天真推
groupMonthlyReportCron: '0 18 23 28-31 * *'
#*回复时是否引用触发指令那条消息
quoteReply: true
#*私聊主人的运维提醒（全局账号登录态失效、账号被营地限流、营地消息推不出去、保活结果、
#*共享库接入提醒）默认只发给**第一个主人**，不再群发所有主人。
#*要换人或者多选，在锅巴「主人通知收件人」里勾；留空 = 只发第一个主人。
#*勾了的人被移出主人列表时会自动回落到第一个主人，不会把提醒静默丢掉。
masterNotify: []
#*出图格式：jpeg / png / webp。插件所有出图指令（战绩、主页、皮肤墙、帮助面板…）统一走它，
#*实现在 utils/imageType.js，锅巴「出图 → 输出图片类型」对应这一项。
#*⚠️ 微信（ComWeChat）适配器下别填 webp：微信的图片接口不认 webp，会把它降级成「文件」
#*发出去 —— 群里收到的是 xxx.webp 文件卡片，不是图（2026-09-24 实测）。
#*QQ / OneBot 等平台用 webp 能省三成左右体积。填了别的值一律按 jpeg 处理。
imgType: jpeg
#*图片缓存目录（data/imgCache）的容量上限，单位 MB。填 0 = 不限量。
#*单张图平均 490KB，#皮肤墙 / #全部皮肤 一次会拉几百张，几个人轮着查就是几百 MB；
#*7 天过期只管时间管不住量，超出上限时按下载时间从旧到新削减
imgCacheMaxMB: 200
#*图片缓存的定时清理时间（6 位 cron）。默认凌晨 4 点，避开白天出图高峰
imgCacheCleanCron: '0 12 4 * * *'
#*皮肤上新推送的检查时间（6 位 cron）。留空 = 不自动推送，只保留 #皮肤上新 指令。
#*数据来自官网资料库（不占营地配额），每天看一次就够：新皮肤都是提前几天进清单的
skinNewsCron: '0 26 12 * * *'
#*王者公告推送的检查时间（6 位 cron）。留空 = 不自动推送，只保留 #王者公告 指令。
#*数据来自官网资讯接口（不占营地配额），所以可以查勤一点：版本更新/体验服公告
#*一天里什么时候都可能发，默认每 2 小时看一次。首次运行只记时间水位、不补推历史
gameNewsCron: '0 53 */2 * * *'
#*插件黑名单。名单里的 QQ 发任何王者指令都不会有回应，之前订阅的战绩推送 / 上下线提醒 /
#*日报周报月报也不再推，群报和排行榜里也不统计他。订阅数据不会被删，移出名单即恢复。
#*主人不受影响。也可以在群里发 #王者拉黑@某人 / #王者取消拉黑@某人 增删
blackList: []
#*是否把机器人全局黑名单（Yunzai 的 config/config/other.yaml，blackUser / blackQQ 两个字段）
#*里的人也当成拉黑。默认开：全局名单只挡用户主动发的指令，挡不住插件按 cron 主动发的推送，
#*开着才能把「人已经拉黑了，战绩推送还在推」这种情况一起停掉
blackListFollowGlobal: true
#*营地ID共享库的地址。留空 = 不接入，用户发 #开启营地ID共享 会被提示「还没接入」。
#*共享库由主人统一提供，地址进群 972915804 找主人要（不再支持自行部署）。
#*在群里发 #营地共享库地址 <地址> 也能改，不用手改这里
shareApiUrl: 'https://gok.9e.nz:442'
#*⚠️ 已废弃：令牌合并到下面的 distToken 了（观战 / 营地消息 / 共享库 三套共用一个）。
#*这里只在读取时作回退 —— 合并之前配过的机器不用重新填，新配置请用 distToken。
shareToken: ''
#*共享库的管理密钥（服务端 .env 里的 GOK_ADMIN_SECRET），远程管理专用。
#*库跑在别的机器或 Docker 上时，配上它就能用 #营地共享库发令牌 / 接入方 / 吊销
#*这些指令远程管库；本机部署用不到（插件自己读 .env）。权限很大，别往群里贴；
#*用 #营地共享库管理密钥 <密钥> 设置（只收私聊）
shareAdminSecret: ''
#*是否接入共享库。对应 #接入营地共享库 / #关闭营地共享库 两个指令，
#*也是首次安装和每次更新后私聊征询主人的那个开关。默认关：
#*不接入时本插件所有功能都不受影响，只是用不到「换机器人免重绑」
#*共享库由主人统一提供，地址和令牌进群 972915804 找主人要
shareEnabled: false
#*服务端接入时自动安装缺失的 pm2 / ffmpeg。外网受限时可填国内 npm 镜像或代理。
dependencyRegistry: 'https://registry.npmmirror.com'
dependencyProxy: ''
#*ffmpeg 的完整路径。留空 = 自动找（先查 PATH，再扫常见安装目录）。
#*⚠️ 自动找**不可能覆盖所有装法** —— Windows 上解压到哪个盘、目录叫什么名字
#*全看用户自己，扫不到就只能手填。找不到时可执行 `ffmpeg -version` 看能不能跑，
#*能跑就把 `where ffmpeg`（Windows）或 `which ffmpeg`（Linux/macOS）的输出填进来。
#*填了就以它为准，自动查找整个跳过。
ffmpegPath: ''
#*服务端代码分发的地址（主人服务器上跑的那个分发服务，默认端口 6868）。
#*#营地观战接入 / #营地消息接入 会把它写进来，也可以直接在锅巴里填。
#*留空 = 还没接入，部署指令会提示进群 972915804 找主人要。
distUrl: ''
#*主人签发的接入令牌 —— **观战 / 营地消息 / 共享库 三套共用这一个**。
#*主人签发时是「代共享库签」的，所以一个值三边都认，不用分别填。
#*⚠️ 这是凭证，别往群里贴；用 #营地共享库令牌 <令牌> 设置。
distToken: ''
#*分发服务的管理密钥（主人用：签令牌 / 看接入方 / 吊销）。
#*本机部署了分发服务时会自动读它的 .env，不用填；分发服务跑在别的机器上时才要填。
distAdminSecret: ''
#*分发服务的代码在哪个仓库（部署时拉它的 dist 分支）。
#*一般不用改 —— 只有换成自己的私库时才要。
distRepoUrl: ''
#*观战服务的地址。两种用法：
#*  · 自己部署：填本机的 'http://127.0.0.1:8898'（发过 #营地观战部署 之后默认就是它）
#*    ⚠️ 这是**控制面**端口（只绑本机回环）；公网的 8899 播放面不受理开播/停止/名单
#*  · 用别人的：填对方给的那个地址，发 #营地观战连接 <地址> 一步配好，**不用自己部署**
#*连别人的服务端时，插件会把自己扫码登录的账号递给对方（只走内存、不在对方机器落盘）。
#*换端口或换地址都改这里，不用重启云崽。
watchApiUrl: 'http://127.0.0.1:8898'
#*观战直播间对外的地址 —— 就是发到群里、给群友点开的那个。
#*留空 = 用上面那个，但 127.0.0.1 只有本机能开，群友点了是空的。
#*部署时一定填成外网能访问的地址（域名或公网 IP），比如 http://xxx.com:8899
watchPublicUrl: ''
#*https 观众的 Cloudflare Worker CDN 域名。按 server/README-CDN-HTTPS.md 部署后填写，例如 https://cdn.example.com。
#*修改或清空后保存，再发 #营地观战部署 生效；留空时 https 观众走本机转发，http 观众仍直连营地 CDN。
watchCdnHttps: ''

#*开播引导：订阅上下线提醒的人上线后，盯他进对局；进对局满 N 分钟且确认能看时，
#*往群里发一条「要不要开播」的提示（不 @ 订阅者，群里谁都能发 #营地开播 开这一路）。
#*⚠️ 这条提示里**带着开局信息**（进入什么模式 / 英雄 / 该英雄场次与胜率），
#*和「开局提醒」合成了同一条 —— 开了上下线提醒的人每局只会收到这一条，不再另发一条。
#*看不了的对局（模式不能观战 / 藏了战绩 / 不是好友）仍照常播报一条开局提醒，不会漏。
#*只对「是某个全局账号好友」的号生效 —— 不是好友的话取流会被拒，提示了也开不了。
watchHintEnabled: true
#*进对局满几分钟才发开播提示
watchHintAfterMin: 3
#*盯梢轮询间隔（毫秒）。这是插件里唯一的短间隔定时器，只盯「刚上线且是好友」的那几个号。
#*别调太小：营地接口有频控，命中一次要静默 12 小时。下限 5000。
watchHintPollMs: 15000
#*营地登录态保活。营地的 token **不给过期时间、也没有刷新接口** —— 它是「用则续命、
#*闲置才死」（闲置久了报登录态失效）。这里配个时间，插件会定期给每个号戳一下把它保住，
#*QQ 和微信都适用。留空 = 关掉定时（还能手发 #营地续期）。
#*QQ 号万一真失效了还能自动重登救回；微信失效只能重新扫码（营地只认扫码换来的 code）。
campRenewCron: '0 13 5 * * *'

#*营地每日自动签到。到点给账号池里每个号签一次，结果**私聊各自的号主**
#*（谁扫的号记谁名下，见 #营地wx全局登录 / #营地QQ全局登录）。
#*⚠️ 一切正常就不打扰：只有「真签上了」和「真失败了」才私聊，
#*   「今天已签过」「这个号没绑王者角色」都是日常状态，不会推。
#*⚠️ 没归属人的老号，结果只报给主人。
#*默认每天 7:30。留空 = 关掉定时（还能手发 #王者签到）。
campSignCron: '0 30 7 * * *'

#*营地消息服务地址。两种用法：
#*  · 自己部署：保持 'http://127.0.0.1:8900'（发过 #营地消息部署 之后就是这个）
#*  · 用别人的：填对方给的地址，发 #营地消息连接 <地址> 一步配好，**不用自己部署**
campImApiUrl: 'http://127.0.0.1:8900'
#*营地消息总开关。关掉后插件不再拉消息、也不再推私信（服务端照常收）。
#*⚠️ 只有**开关开着 + 至少有一个号在收消息名单里**时才会真的去连服务端 ——
#*一个号都没开（或还没接入）时不发任何请求，日志也不会被「拉取失败」刷屏。
campImEnabled: true
#*拉消息的间隔（毫秒）。走本机回环、无风控，只影响推送延迟，别调太小（下限 1000）。
#*⚠️ 服务端连不上时会自动退避（6s → 12s → 24s → 48s → 封顶 60s），拉通一次立刻恢复正常；
#*失败日志也按 10 分钟一节流，不会每轮刷一条。
campImPollMs: 3000
#*推送时带不带对方头像。关掉就是纯文字（头像加载慢或发图失败时更稳）。
campImPushImage: true
