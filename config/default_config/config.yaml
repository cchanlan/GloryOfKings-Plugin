#*战绩推送总开关（开局提醒 + 打完推战绩，用户需各自 #开启战绩推送 订阅）
onlineReminder: true
#*战绩推送的检查间隔（6 位 cron，含秒）。每个订阅串行拉一次营地接口、间隔 800ms，
#*设太短会触发营地频控 -30107，不建议低于 2 分钟
battleResultCron: '0 */2 * * * *'
#*玩家离线时把检查间隔拉长到几倍 battleResultCron（离线的号既不会开局也不会出新战绩，
#*照高频查纯属白耗配额）。默认 5，即 2 分钟的 cron 在长时间离线后退到 10 分钟一次。
#*代价是上线播报最坏晚这么久；填 1 = 关闭自适应，恒定按 cron 轮询
idleBackoffMax: 5
#*战绩日报的推送时间（6 位 cron）。留空 = 不自动推送，只保留 #王者日报 指令。
#*刻意避开整点：整点是所有人 cron 的默认值，营地那头也扎堆
dailyReportCron: '0 47 23 * * *'
#*战绩周报的推送时间。默认周日晚，和「本周（周一起）」的口径对齐
weeklyReportCron: '0 7 22 * * 0'
#*回复时是否引用触发指令那条消息
quoteReply: true
