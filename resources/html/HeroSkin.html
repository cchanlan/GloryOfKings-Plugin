<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>角色皮肤展示</title>
    <style>
        /* 皮肤图鉴：顶部标题 + 款数，下面一列式大图，逐款一张立绘。 */
        :root {
            --gok-page-bg: #1a1a1a;
            --gok-card-bg: #2a2a2a;
            --gok-ink: #ffffff;
            --gok-line: #3a3a3a;
        }

        body {
            font-family: Arial, sans-serif;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            background-color: var(--gok-page-bg);
            color: var(--gok-ink);
        }

        .gok-skin-head {
            text-align: center;
            margin-bottom: 30px;
        }

        .gok-skin-grid {
            display: grid;
            gap: 20px;
            grid-template-columns: 1fr;
        }

        .gok-skin-card {
            position: relative;
            background-color: var(--gok-card-bg);
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        .gok-skin-pic {
            width: 100%;
            height: auto;
            border-radius: 5px;
            display: block;
        }

        .gok-skin-blank {
            height: 180px;
            border-radius: 5px;
            border: 1px dashed var(--gok-line);
            color: #7a7a7a;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gok-skin-total {
            text-align: center;
            margin: -20px 0 30px;
            color: #9a9a9a;
            font-size: 16px;
        }

        .gok-skin-name {
            display: block;
            color: #ffffff !important;
            font-size: 18px;
            margin-bottom: 10px;
            padding: 8px 20px;
            background: linear-gradient(135deg, #3a3a3a 0%, #2a2a2a 100%);
            border: 1px solid #4a4a4a;
            width: fit-content;
            position: relative;
            border-radius: 0 15px 0 15px;
            box-shadow: 3px 3px 5px rgba(0, 0, 0, 0.2);
        }

        .gok-skin-name::before,
        .gok-skin-name::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            background: #ffd700;
        }

        .gok-skin-name::before {
            top: -1px;
            left: -1px;
            border-radius: 0 0 3px 0;
        }

        .gok-skin-name::after {
            bottom: -1px;
            right: -1px;
            border-radius: 3px 0 0 0;
        }

        .gok-skin-name:empty {
            display: none;
        }
    </style>
</head>

<body>
    <h1 class="gok-skin-head">{{heroName}}皮肤图鉴</h1>
    <div class="gok-skin-total">共 {{skinCount}} 款</div>

    <div class="gok-skin-grid">
        {{each skinData skin}}
        <div class="gok-skin-card">
            <span class="gok-skin-name">{{skin.name}}</span>
            {{if skin.url}}
            <img src="{{skin.url}}" alt="{{skin.name}}" class="gok-skin-pic">
            {{else}}
            <div class="gok-skin-blank">暂无立绘</div>
            {{/if}}
        </div>
        {{/each}}
    </div>
</body>

</html>
