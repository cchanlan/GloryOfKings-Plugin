<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>角色皮肤展示</title>
    <style>
        /* 皮肤图鉴：顶部标题 + 款数，下面一列式大图，逐款一张立绘。 */
        :root {
            --gok-page-bg:#101112;
            --gok-card-bg:#1b1a17;
            --gok-ink:#eee8dc;
            --gok-line:#363128;
        }

        body {
            font-family:Arial, sans-serif;
            max-width:1400px;
            margin:0 auto;
            padding:20px;
            background-color:var(--gok-page-bg);
            color:var(--gok-ink);
        }

        .gok-skin-head {
            text-align:center;
            margin-bottom:30px;
        }

        .gok-skin-grid {
            display:grid;
            gap:20px;
            grid-template-columns:1fr;
        }

        .gok-skin-card {
            position:relative;
            background-color:var(--gok-card-bg);
            border-radius:5px;
            padding:15px;
            box-shadow:none;
        }

        .gok-skin-pic {
            width:100%;
            height:auto;
            border-radius:5px;
            display:block;
        }

        .gok-skin-blank {
            height:180px;
            border-radius:5px;
            border:1px dashed var(--gok-line);
            color:#aaa499;
            font-size:20px;
            display:flex;
            align-items:center;
            justify-content:center;
        }

        .gok-skin-total {
            text-align:center;
            margin:-20px 0 30px;
            color:#aaa499;
            font-size:20px;
        }

        .gok-skin-name {
            display:block;
            color:#eee8dc !important;
            font-size:22px;
            margin-bottom:10px;
            padding:8px 20px;
            background:linear-gradient(135deg, #1b1a17 0%, #1b1a17 100%);
            border:1px solid #363128;
            width:fit-content;
            position:relative;
            border-radius:5px;
            box-shadow:none;
        }

        .gok-skin-name::before,
        .gok-skin-name::after {
            content:'';
            position:absolute;
            width:8px;
            height:8px;
            background:#262116;
        }

        .gok-skin-name::before {
            top:-1px;
            left:-1px;
            border-radius:5px;
        }

        .gok-skin-name::after {
            bottom:-1px;
            right:-1px;
            border-radius:5px;
        }

        .gok-skin-name:empty {
            display:none;
        }
    </style>
<link rel="stylesheet" href="{{_res_path || '../../../plugins/GloryOfKings-Plugin/resources/'}}css/ui-blackgold-legacy.css">
<style id="gok-ui-custom">{{@_gokUiStyle || ''}}</style>
<link rel="stylesheet" href="{{_res_path || '../../../plugins/GloryOfKings-Plugin/resources/'}}css/ui-name-layout.css?v=20261125-name-data-r3">
</head>

<body data-gok-page="HeroSkin"><header class="gok-ui-brand"><div class="gok-ui-eyebrow">GLORY OF KINGS / 王者荣耀</div><div class="gok-ui-title"><img class="gok-ui-logo" src="{{_res_path || '../../../plugins/GloryOfKings-Plugin/resources/'}}img/app_logo.png" alt="王者荣耀 App"><h1>皮肤<em>图鉴</em></h1></div></header>
<div class="gok-content-panel">
    <h1 class="gok-skin-head gok-name-wrap">{{heroName}}皮肤图鉴</h1>
    <div class="gok-skin-total">共 {{skinCount}} 款</div>

    <div class="gok-skin-grid">
        {{each skinData skin}}
        <div class="gok-skin-card">
            <span class="gok-skin-name gok-name">{{skin.name}}</span>
            {{if skin.url}}
            <img src="{{skin.url}}" alt="{{skin.name}}" class="gok-skin-pic">
            {{else}}
            <div class="gok-skin-blank">暂无立绘</div>
            {{/if}}
        </div>
        {{/each}}
    </div>

</div>
</body>

</html>
